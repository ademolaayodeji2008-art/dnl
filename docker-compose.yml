services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_voucher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pv_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/payment_voucher
      JWT_SECRET: change_this_before_live_use
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  pv_postgres:
